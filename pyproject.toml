[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mllabiome"
version = "0.1.0rc69"
description = "Machine learning, ensemble learning, explainable AI for microbiota data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "mllabiome contributors"}]
keywords = ["microbiome", "machine-learning", "bioinformatics", "explainability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.6",
  "matplotlib>=3.6",
  "polars>=0.20",
  "pyarrow>=12",
  "xgboost>=2",
  "lightgbm>=4",
  "catboost>=1.2",
  "shap>=0.44",
  "lime>=0.2.0.1",
  "PyALE>=1.2.0",
  "networkx>=3",
  "scikit-bio>=0.7.0",
  "rich>=13",
  "flaml>=2",
  "tqdm>=4.66",
  "psutil>=7.2.2",
  "ruff>=0.16.7",
]

[project.urls]
Homepage = "https://github.com/CMG-GUTS/mllabiome"
Repository = "https://github.com/CMG-GUTS/mllabiome"
Issues = "https://github.com/CMG-GUTS/mllabiome/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.16.7",
]

[project.scripts]
mllabiome = "mllabiome.cli:main"

[tool.setuptools.packages.find]
include = ["mllabiome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.package-data]
mllabiome = ["py.typed", "_r/*.R"]
