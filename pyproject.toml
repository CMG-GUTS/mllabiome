[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "mllabiome"
dynamic = ["version"]
description = "Machine learning, ensemble learning, multimodal modeling, and explainable AI for microbiota data with end to end evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Agata Polejowska" }
]
keywords = [
  "microbiome",
  "microbiota",
  "metagenomics",
  "machine-learning",
  "bioinformatics",
  "microbiome-machine-learning",
  "ensemble-learning",
  "multimodal-learning",
  "explainable-ai",
  "xai",
  "shap",
  "lime",
  "nested-cross-validation",
  "cross-validation",
  "compositional-data",
  "biomarker-discovery",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]


dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.6",
  "matplotlib>=3.6",
  "polars>=0.20",
  "pyarrow>=12",

  "xgboost>=2",
  "lightgbm>=4",
  "catboost>=1.2",
  "flaml>=2",

  "shap>=0.44",
  "lime>=0.2.0.1",
  "PyALE>=1.2.0",

  "scikit-bio>=0.7.0",
  "networkx>=3",

  "rich>=13",
  "tqdm>=4.66",
  "psutil>=7.2.2",
]


[project.urls]
Homepage = "https://github.com/CMG-GUTS/mllabiome"
Documentation = "https://cmg-guts.github.io/mllabiome/"
Repository = "https://github.com/CMG-GUTS/mllabiome"
Issues = "https://github.com/CMG-GUTS/mllabiome/issues"
Changelog = "https://github.com/CMG-GUTS/mllabiome/blob/main/CHANGELOG.md"


[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.16.7",
]

benchmark = [
    "curated-microbiota>=0.2.0",
    "curated-microbiota-gut-brain-axis>=0.1.0",
]


[project.optional-dependencies]
federated = [
  "flwr[simulation]>=1.39,<1.40; python_version >= '3.11'",
]

tabpfn = [
  "tabpfn==9.1.0",
]

pdf = [
  "PyMuPDF>=1.26",
]

waypoint = [
  "waypoint-bio==1.0.2",
  "torch>=2.0.1",
  "transformers>=4.33.3,<5",
  "filelock>=3.13",
]

mgm = [
  "microformer-mgm==0.5.8",
  "torch>=2.0.1",
  "transformers>=4.33.3,<5",
  "filelock>=3.13",
]

mgm2 = [
  "torch>=2.0.1",
  "transformers>=4.33.3,<5",
  "pytorch-lightning>=2.0.6,<3",
  "h5py>=3.8",
  "huggingface-hub>=0.23",
  "biopython>=1.81",
  "filelock>=3.13",
]

foundation = [
  "waypoint-bio==1.0.2",
  "microformer-mgm==0.5.8",
  "torch>=2.0.1",
  "transformers>=4.33.3,<5",
  "pytorch-lightning>=2.0.6,<3",
  "h5py>=3.8",
  "huggingface-hub>=0.23",
  "biopython>=1.81",
  "filelock>=3.13",
]

[tool.uv]
override-dependencies = [
  "numpy>=1.24.3,<3",
  "pandas>=2.0.3,<3",
  "pytorch-lightning>=2.0.6,<3",
  "scikit-learn>=1.6,<2",
  "setuptools>=82",
  "torch>=2.0.1",
  "tqdm>=4.66",
  "transformers>=4.33.3,<5",
  "accelerate>=0.20.1",
]


[tool.uv.sources]
curated-microbiota = { git = "https://github.com/CMG-GUTS/curated-microbiota", tag = "v0.2.0" }
curated-microbiota-gut-brain-axis = { git = "https://github.com/CMG-GUTS/curated-microbiota-gut-brain-axis", tag = "v0.1.0" }

[project.scripts]
mllabiome = "mllabiome.cli:main"


[tool.setuptools.dynamic]
version = { attr = "mllabiome._version.__version__" }


[tool.setuptools.packages.find]
include = ["mllabiome*"]


[tool.setuptools.package-data]
mllabiome = [
  "py.typed",
  "_r/*.R",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
[tool.flwr.app]
publisher = "cmg-guts"
fab-format-version = 1
flwr-version-target = "1.39.0"

[tool.flwr.app.components]
serverapp = "mllabiome.federated.flower_app:server_app"
clientapp = "mllabiome.federated.flower_app:client_app"

[tool.flwr.app.config]
num-server-rounds = 10
local-epochs = 2
num-shares = 3
reconstruction-threshold = 2
clipping-range = 8.0
max-weight = 1000.0
num-clients = 3
num-features = 10
alpha = 0.0001
eta0 = 0.01
random-state = 42
data-dir = ""
output-path = ""

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 3
